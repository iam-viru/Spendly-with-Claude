{% extends "base.html" %}
{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Track a new expense</p>
        </div>
        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input class="form-input" type="number" id="amount" name="amount"
                           step="0.01" min="0.01" required
                           value="{{ amount or '' }}" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select class="form-input" id="category" name="category" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Select category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input class="form-input" type="date" id="date" name="date"
                           required value="{{ date or '' }}">
                </div>

                <div class="form-group">
                    <label for="description">Description <span style="color:var(--ink-faint)">(optional)</span></label>
                    <textarea class="form-input" id="description" name="description"
                              rows="2" maxlength="200"
                              placeholder="e.g. Lunch at cafe">{{ description or '' }}</textarea>
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
            </form>

            <div class="auth-switch">
                <a href="{{ url_for('profile') }}">Back to profile</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
